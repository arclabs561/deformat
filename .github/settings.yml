# Managed by repository-settings/app
# https://github.com/repository-settings/app
repository:
  description: "Extract plain text from HTML, PDF, DOCX, EPUB, and other document formats"
  homepage: "https://docs.rs/deformat"
  private: false
  has_issues: true
  has_wiki: false
  has_downloads: true
  default_branch: main
  allow_squash_merge: true
  allow_merge_commit: true
  allow_rebase_merge: true
  delete_branch_on_merge: true
  topics:
    - html
    - pdf
    - docx
    - epub
    - rtf
    - xlsx
    - pptx
    - text-extraction
    - rust
