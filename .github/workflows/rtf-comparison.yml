name: Verify RTF parser fixes
on:
  push:
    branches: ['experiment/rtf-12-output']
permissions:
  contents: read
jobs:
  rtf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          path: experiment
          persist-credentials: false
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          path: deformat
          ref: 8fb565ec40c7491e75699b22689dd0983bd13eaf
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          repository: TwelveTake-Studios/rtf-parser-tt
          ref: 3178d62b0c05a9cb294127b2c42cb58afb62ed5a
          path: upstream
          persist-credentials: false
      - name: Apply the proposed fix to the released parser source
        working-directory: upstream
        run: git apply ../experiment/.github/rtf-parser-fixes.patch
      - name: Test upstream with all features
        working-directory: upstream
        run: cargo test --all-features
      - name: Test upstream with default features disabled
        working-directory: upstream
        run: cargo test --no-default-features
      - name: Verify the downstream RTF cases
        working-directory: deformat
        run: cargo test --config 'patch.crates-io.rtf-parser-tt.path="../upstream"' --features rtf --test format_regressions rtf_
