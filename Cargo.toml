[package]
name = "deformat"
version = "0.6.0"
edition = "2021"
rust-version = "1.80.0"
license = "MIT OR Apache-2.0"
description = "Extract plain text from HTML, PDF, and other document formats"
repository = "https://github.com/arclabs561/deformat"
readme = "README.md"
keywords = ["text-extraction", "html", "pdf", "document", "nlp"]
categories = ["text-processing", "parser-implementations"]
include = [
  "/src/**/*.rs",
  "/tests/**/*.rs",
  "/examples/**/*.rs",
  "/benches/**/*.rs",
  "/Cargo.toml",
  "/LICENSE-*",
  "/README.md",
]

[dependencies]
memchr = "2"

# Optional: JSON serialization for Extracted, Format, Extractor
serde = { version = "1", optional = true, features = ["derive"] }

# Optional: DOM-based HTML-to-text conversion
html2text = { version = "0.16", optional = true }

# Optional: readability-style article extraction
dom_smoothie = { version = "0.15", optional = true }

# Optional: PDF text extraction
pdf-extract = { version = "0.10", optional = true }

# Optional: DOCX/EPUB extraction (ZIP-based formats)
zip = { version = "2", optional = true, default-features = false, features = ["deflate"] }

# Optional: RTF text extraction
rtf-parser-tt = { version = "0.5", optional = true }

# Optional: XLSX/ODS spreadsheet text extraction
calamine = { version = "0.34", optional = true }

[features]
default = []
html2text = ["dep:html2text"]
readability = ["dep:dom_smoothie"]
pdf = ["dep:pdf-extract"]
docx = ["dep:zip"]
epub = ["dep:zip"]
rtf = ["dep:rtf-parser-tt"]
xlsx = ["dep:calamine"]
serde = ["dep:serde"]

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
flate2 = "1"
proptest = "1"
serde_json = { version = "1", optional = false }

[[bench]]
name = "strip"
harness = false
