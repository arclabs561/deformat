[package]
name = "deformat"
version = "0.15.3"
edition = "2021"
rust-version = "1.91.0"
license = "MIT OR Apache-2.0"
description = "Extract plain text from HTML, PDF, and other document formats"
repository = "https://github.com/arclabs561/deformat"
readme = "README.md"
keywords = ["text-extraction", "html", "pdf", "document", "nlp"]
categories = ["text-processing", "parser-implementations"]
include = [
  "/src/**/*.rs",
  "/tests/**/*.rs",
  "/tests/fixtures/**/*",
  "/examples/**/*.rs",
  "/benches/**/*.rs",
  "/Cargo.toml",
  "/LICENSE-*",
  "/README.md",
  "/CHANGELOG.md",
]

# docs.rs builds with every feature so the feature-gated modules (pdf,
# docx, epub, ...) and their intra-doc links render. Without this the
# published docs show only the default (memchr-only) surface.
[package.metadata.docs.rs]
all-features = true

[workspace]
exclude = ["fuzz"]

[dependencies]
memchr = "2"

# Optional: JSON serialization for Extracted, Format, Extractor
serde = { version = "1", optional = true, features = ["derive"] }

# Optional: DOM-based HTML-to-text conversion
html2text = { version = "0.16", optional = true }

# Optional: readability-style article extraction
dom_smoothie = { version = "0.15", optional = true }

# Optional: PDF text extraction via pdf_oxide.
pdf_oxide = { version = "0.3", optional = true }

# Optional: DOCX/EPUB extraction (ZIP-based formats)
zip = { version = "2", optional = true, default-features = false, features = [
  "deflate",
] }

# Optional: RTF text extraction
rtf-parser-tt = { version = "0.5", optional = true }

# Optional: XLSX/ODS spreadsheet text extraction
calamine = { version = "0.34", optional = true }

# Optional: language detection on extracted text
whichlang = { version = "0.1", optional = true }

# Optional: charset detection / decoding for non-UTF-8 HTML input
encoding_rs = { version = "0.8", optional = true }

[features]
default = []
html2text = ["dep:html2text"]
readability = ["dep:dom_smoothie"]
pdf = ["dep:pdf_oxide"]
pdf_oxide = ["dep:pdf_oxide"]
docx = ["dep:zip"]
epub = ["dep:zip"]
rtf = ["dep:rtf-parser-tt"]
xlsx = ["dep:calamine"]
pptx = ["dep:zip"]
serde = ["dep:serde"]
whichlang = ["dep:whichlang"]
encoding_rs = ["dep:encoding_rs"]

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1"
serde_json = "1"

[[bench]]
name = "strip"
harness = false

[[example]]
name = "clean_html"
required-features = ["readability"]
